name: Bug 报告
description: 报告可复现的功能异常、崩溃或执行语义错误（请先搜索已有 issue）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！填写前请先搜索 [已有 issue](https://github.com/czyt1988/dsh-workflow-orchestrator/issues)，确认不是重复问题。

        **这不是报告安全漏洞的地方**——请按 [SECURITY.md](https://github.com/czyt1988/dsh-workflow-orchestrator/blob/main/SECURITY.md) 的私密渠道报告。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，确认这不是重复问题
          required: true
        - label: 这不是安全漏洞（安全漏洞走 Security Advisories 私密报告）
          required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: DSH 桌面端版本号，可在 DSH 的「设置 → 关于」中查看。
      placeholder: 例如 1.2.3
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: 见 `package.json` 的 `version` 字段，或 DSH 插件管理器里显示的版本。
      placeholder: 例如 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      description: 如果还需要说明版本（如 Windows 11 23H2 / Ubuntu 24.04），请写在「附加信息」里。
      options:
        - Windows 11
        - Windows 10
        - macOS（Apple Silicon）
        - macOS（Intel）
        - Ubuntu / Debian
        - 其他 Linux 发行版
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出最小、可重复的操作序列。若涉及工作流，请描述节点与连线的拓扑（例如 `A → B`、`A、B → 并行网关 → C`）。
      placeholder: |
        1. 打开「工作流编排」页面
        2. 添加两个任务节点并连线 A → B
        3. 点击「执行」
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      placeholder: 你认为应该发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      placeholder: 实际发生了什么？是否报错、卡住、状态不对？
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 粘贴底部「消息窗口」的运行日志，或 DSH 宿主 / 浏览器控制台的错误。**请先脱敏**：去掉 token、Cookie、完整会话内容与本机绝对路径。
      render: text
      placeholder: |
        12:50:41 INFO 工作流「工作流 1」开始执行（2 个节点）
        12:50:41 ERROR 任务「任务 1」执行失败：...
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 直接把图片拖进文本框即可上传；界面问题建议附上截图或录屏。
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 其他可能有用的上下文，例如是否使用默认工作区、模型 / 模式 / 权限设置、是否在隔离环境复现。
    validations:
      required: false
